# The Go module's CI (go/, github.com/knkcs/fieldkit/go), from the org's
# shared workflows (knkCS/workflows), following the caller template in
# contenthub's docs/conventions.md.
#
# Actions in this org are currently blocked by a billing issue, so this does
# not run: `npm run verify` is the gate, and it runs the same Go checks
# (scripts/verify-go.sh). The file is committed so the gate moves back to CI
# the moment Actions run again.
#
# KNOWN GAP — read before relying on this: go-service-ci.yml runs `go vet` and
# `go test` at the repository root, and this module lives in go/. There is no
# go.mod at the root and a go.work cannot make `./...` reach a module in a
# subdirectory, so those steps fail until the shared workflow takes a
# `working-directory` input. It is passed below so the caller needs no edit
# once that input exists. Until then the shared workflow ignores the input it
# does not declare (docs/conventions.md, "Pinning"), and `go vet ./...` at the
# root fails for want of a go.mod — a loud failure, never a green gate that
# checked nothing. ci.yml runs the module's real checks meanwhile
# (`npm run verify:go`).
#
# PRIVATE MODULES: the module depends on github.com/knkcms/knkeditor/go
# (#216), in the knkcms org. The shared workflow's configure-private-modules
# sets GOPRIVATE=github.com/knkcs/* only, so fetching it fails until that
# action also covers knkcms (change it in knkCS/workflows, not here) and
# CI_TOKEN can read knkcms/knkeditor. ci.yml sets both itself meanwhile.
#
# Pinned to @v1, which (at 7d6dc74) declares every other input used here —
# `check-gofmt` included. Pin to the commit that adds `working-directory`
# when it lands, per the conventions doc's "Pinning" rule.
name: Go
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    uses: knkcs/workflows/.github/workflows/go-service-ci.yml@v1
    with:
      go-version-file: go/go.mod
      working-directory: go
      # "testcontainers" is the mode that starts no service containers: its job
      # is a plain `go test`, and this module needs no containers at all.
      test-mode: testcontainers
      test-timeout: 10m
      check-ent-drift: false
      check-gofmt: true
    secrets: inherit
