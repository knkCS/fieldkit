# The Go module's CI (go/, github.com/knkcs/fieldkit/go), from the org's
# shared workflows (knkCS/workflows, docs/adopting.md there): the PR suite on
# pull requests, the light merge check (vet, no tests) on pushes to main.
#
# The module lives in go/, so `working-directory: go` runs every Go step
# there; `go-version-file` stays relative to the repository root.
#
# PRIVATE MODULES: the module depends on github.com/knkcms/knkeditor/go
# (#216). The shared configure-private-modules sets
# GOPRIVATE=github.com/knkcs/*,github.com/knkcms/*, so CI_TOKEN must be able
# to read knkcms/knkeditor.
#
# Pinned to @v1 (knkCS/workflows ADR 0003): an input v1 does not declare fails
# the run at startup, it is never silently ignored.
name: Go
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    if: ${{ github.event_name == 'pull_request' }}
    uses: knkcs/workflows/.github/workflows/go-service-ci.yml@v1
    with:
      mode: pr-suite
      # Keep these three identical in merge-check below: they make up the Go
      # cache key the merge check warms on main.
      go-version-file: go/go.mod
      working-directory: go
      runs-on: ubuntu-latest
      # "testcontainers" is the mode that starts no service containers: its job
      # is a plain `go test`, and this module needs no containers at all.
      test-mode: testcontainers
      test-timeout: 10m
      check-ent-drift: false
      check-gofmt: true
    secrets:
      CI_TOKEN: ${{ secrets.CI_TOKEN }}

  merge-check:
    if: ${{ github.event_name == 'push' }}
    uses: knkcs/workflows/.github/workflows/go-service-ci.yml@v1
    with:
      mode: merge-check
      go-version-file: go/go.mod
      working-directory: go
      runs-on: ubuntu-latest
      check-ent-drift: false
      check-gofmt: true
    secrets:
      CI_TOKEN: ${{ secrets.CI_TOKEN }}
