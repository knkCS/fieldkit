name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# knkCS/workflows' concurrency block (docs/adopting.md there), verbatim.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # The Node suite plus the Go module's tests and fuzz: the shared
    # go-service-ci's `go` job default.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The lockfile pulls @knkcms packages from GitHub Packages, which needs a
      # token even to read; CI_TOKEN has read:packages there. It goes into
      # ~/.npmrc, as go-service-ci's npm-github-packages does: there is no
      # committed .npmrc to shadow it.
      - name: Authenticate to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${CI_TOKEN}" >> ~/.npmrc
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run catalogue:check
      # The Catalogue may only grow (ADR-0019): compared with the one the last
      # release froze under conformance/<version>/.
      - run: npm run catalogue:compat
      - run: npm run build
      - run: npm run verify-exports
      - run: npm run test
      # The Go module's checks, as `npm run verify` runs them. go.yml calls the
      # org's go-service-ci for the same module; this step keeps ci.yml equal
      # to the local gate.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      # The Go module depends on knkeditor's (github.com/knkcms/knkeditor/go,
      # #216), a private module in the knkcms org. The shared action sets
      # GOPRIVATE for knkcs only, so knkcms is added after it; CI_TOKEN needs
      # read access to knkcms/knkeditor.
      - uses: knkcs/workflows/actions/configure-private-modules@v1
        with:
          ci-token: ${{ secrets.CI_TOKEN }}
      - run: echo "GOPRIVATE=github.com/knkcs/*,github.com/knkcms/*" >> "$GITHUB_ENV"
      - run: npm run verify:go
