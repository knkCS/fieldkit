name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run catalogue:check
      # The Catalogue may only grow (ADR-0019): compared with the one the last
      # release froze under conformance/<version>/.
      - run: npm run catalogue:compat
      - run: npm run build
      - run: npm run verify-exports
      - run: npm run test
      # The Go module's checks, as `npm run verify` runs them. go.yml calls the
      # org's go-service-ci for the same module; this step keeps ci.yml equal
      # to the local gate.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
      # The Go module depends on knkeditor's (github.com/knkcms/knkeditor/go,
      # #216), a private module in the knkcms org. The shared action sets
      # GOPRIVATE for knkcs only, so knkcms is added after it; CI_TOKEN needs
      # read access to knkcms/knkeditor.
      - uses: knkcs/workflows/actions/configure-private-modules@v1
        with:
          ci-token: ${{ secrets.CI_TOKEN }}
      - run: echo "GOPRIVATE=github.com/knkcs/*,github.com/knkcms/*" >> "$GITHUB_ENV"
      - run: npm run verify:go
