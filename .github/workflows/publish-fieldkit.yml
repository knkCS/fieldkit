name: Publish @knkcs/fieldkit

# A release tags one commit twice (docs/releasing.md): `vX.Y.Z` runs this
# workflow, and `go/vX.Y.Z` — which `v*` does not match — only gives the Go
# module its version; the Go proxy needs no workflow.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  packages: write

# knkCS/workflows' concurrency block (docs/adopting.md there), verbatim: one
# group per tag, never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    name: Publish to npmjs.org and GitHub Packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No registry-url yet: setup-node would point NPM_CONFIG_USERCONFIG at
      # its own .npmrc, and npm ci would not read the credential below. The
      # npmjs.org registry is set up just before publishing to it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # The lockfile pulls @knkcms packages from GitHub Packages, which needs a
      # token even to read; CI_TOKEN has read:packages there (ci.yml says
      # more). Only npm ci reads ~/.npmrc: both publishes below use the
      # .npmrc setup-node writes, so CI_TOKEN never publishes.
      - name: Authenticate to GitHub Packages
        run: echo "//npm.pkg.github.com/:_authToken=${CI_TOKEN}" >> ~/.npmrc
        env:
          CI_TOKEN: ${{ secrets.CI_TOKEN }}

      - name: Install deps
        run: npm ci

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Catalogue is current and only grew (ADR-0019)
        run: |
          npm run catalogue:check
          npm run catalogue:compat

      - name: Build
        run: npm run build

      - name: Verify exports
        run: npm run verify-exports

      - name: Test
        run: npm test

      - name: Choose the npm dist-tag
        id: dist
        # A release candidate (vX.Y.Z-rc.N, docs/releasing.md) goes out under
        # "next": npm would otherwise move "latest" to it, and every
        # `npm install @knkcs/fieldkit` would pick up the candidate.
        run: |
          case "$GITHUB_REF_NAME" in
            *-rc.*) echo "tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Publish to npmjs.org
        # --ignore-scripts: skip the prepublishOnly rebuild so we publish the exact
        # dist/ that lint/typecheck/verify-exports/test validated above (not a fresh build).
        run: npm publish --provenance --access public --ignore-scripts --tag ${{ steps.dist.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://npm.pkg.github.com
          scope: "@knkcs"

      - name: Publish to GitHub Packages
        # --ignore-scripts: same dist/ as the npmjs publish above; no rebuild.
        run: npm publish --ignore-scripts --tag ${{ steps.dist.outputs.tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
